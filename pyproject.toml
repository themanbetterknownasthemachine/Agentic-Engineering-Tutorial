[project]
name = "bida-project"
version = "0.1.0"
description = "Pistor BIDA data/ML project"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16.0",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
]

[dependency-groups]
dev = ["ruff>=0.4", "mypy>=1.10", "pytest>=8.0"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
